<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wie es funktioniert — App aus Onlineshop</title>
    <meta
      name="description"
      content="Shopify und App synchronisieren sich direkt — ohne Mehrarbeit, mit einfacher Bedienung."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://appausonlineshop.de/wie-es-funktioniert.html" />
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=space-grotesk:500,600,700|dm-sans:400,500,600,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20261018u" />
  </head>
  <body class="inner-page how-page">
    <header class="page-top">
      <a class="legal-back" href="index.html">← Zurück</a>
    </header>

    <main>
      <section class="page-intro reveal reveal--in">
        <p class="page-intro__eyebrow">Funktionen</p>
        <h1 class="page-intro__title">So funktioniert die App</h1>
      </section>

      <section class="sync sync--simple reveal" data-sync aria-label="Synchronisation Shopify und App">
        <div class="sync__stage">
          <div class="sync__panel sync__panel--shop">
            <div class="sync__icon" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none">
                <rect x="8" y="12" width="24" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
                <path d="M14 12V10a6 6 0 0 1 12 0v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="sync__label">Shopify</p>
            <p class="sync__stock">
              <span>Lager</span>
              <strong data-sync-shop>24</strong>
            </p>
          </div>

          <div class="sync__bridge" aria-hidden="true">
            <span class="sync__pulse"></span>
            <svg class="sync__arrows" viewBox="0 0 48 24" fill="none">
              <path d="M4 12h34" stroke="currentColor" stroke-width="2"/>
              <path d="M34 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M44 12H10" stroke="currentColor" stroke-width="2" opacity="0.25"/>
              <path d="M10 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
            </svg>
          </div>

          <div class="sync__panel sync__panel--app">
            <div class="sync__icon" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none">
                <rect x="11" y="5" width="18" height="30" rx="4" stroke="currentColor" stroke-width="2"/>
                <circle cx="20" cy="29.5" r="1.4" fill="currentColor"/>
              </svg>
            </div>
            <p class="sync__label">App</p>
            <p class="sync__stock">
              <span>Lager</span>
              <strong data-sync-app>24</strong>
            </p>
          </div>
        </div>
      </section>

      <section class="how-points how-points--icons">
        <article class="how-point reveal">
          <div class="how-point__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="14" stroke="currentColor" stroke-width="2"/>
              <path d="M13 20.5l4.2 4.2L27 14.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="how-point__title">Keine Mehrarbeit</h2>
          <p class="how-point__text">Alles bleibt in Shopify</p>
        </article>

        <article class="how-point reveal" style="--d: 80ms">
          <div class="how-point__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M10 20h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M24 13l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 27l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="how-point__title">Live-Sync</h2>
          <p class="how-point__text">Bestand &amp; Preise sofort</p>
        </article>

        <article class="how-point reveal" style="--d: 140ms">
          <div class="how-point__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <rect x="9" y="8" width="22" height="24" rx="4" stroke="currentColor" stroke-width="2"/>
              <path d="M15 16h10M15 21h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 class="how-point__title">Einfach bedienen</h2>
          <p class="how-point__text">Tippen &amp; bestellen</p>
        </article>
      </section>

      <section class="offer reveal">
        <h2 class="offer__title">Bereit für den nächsten Schritt?</h2>
        <a class="btn btn--solid" href="angebot.html">Angebot anfragen</a>
      </section>
    </main>

    <footer class="site-footer">
      <nav class="site-footer__nav" aria-label="Rechtliches">
        <a href="impressum.html">Impressum</a>
        <a href="agb.html">AGB</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>

    <script src="main.js?v=20261018u" defer></script>
  </body>
</html>
